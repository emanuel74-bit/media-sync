schema: spec-driven

context: |
  Project: media-sync backend.
  Stack: TypeScript, NestJS, MongoDB/Mongoose, Jest, ESLint, and Prettier.
  This is an existing brownfield repository. Specifications are adopted incrementally.

  Canonical sources have separate responsibilities:
  - backend/CONVENTIONS.md defines current engineering rules using stable rule IDs.
  - docs/adr/ stores append-only architecture and tooling decisions.
  - openspec/specs/ defines current intended observable behavior.
  - openspec/changes/ contains proposed changes until completion and archive.
  - docs/index.md is a navigation dashboard only.
  - Code, tests, and deterministic validation provide implementation evidence.

  Before generating artifacts, inspect the relevant implementation and tests, read
  applicable convention rules, and follow their ADR links. Do not invent current
  behavior from documentation alone. Surface conflicts instead of silently choosing
  one source.

rules:
  proposal:
    - State the problem, intended outcome, scope, and explicit non-goals.
    - Distinguish verified current behavior from proposed behavior.
    - Identify affected domains, APIs, DTOs, events, persistence, configuration, and deployment concerns.
    - Cite applicable CONVENTIONS rule IDs and existing ADRs.
    - State whether the documentation rules require a new or superseding ADR.
    - Include compatibility, migration, rollout, rollback, and operational concerns when relevant.
    - Split unrelated work into separate changes.

  specs:
    - Describe observable behavior and contracts, not ordinary implementation style.
    - Use MUST, SHOULD, and MAY deliberately.
    - Give every requirement concrete GIVEN/WHEN/THEN scenarios.
    - Cover failure, empty-state, retry, idempotency, and compatibility behavior when relevant.
    - Do not describe proposed behavior as already implemented.
    - Preserve unaffected behavior explicitly when modifying a requirement.

  design:
    - Inspect actual code and tests before selecting an approach.
    - Read relevant sections of backend/CONVENTIONS.md and cite rule IDs.
    - Read relevant ADRs and do not contradict an accepted decision without a superseding ADR.
    - Explain boundaries, dependency direction, data flow, error handling, and validation.
    - Prefer established repository patterns over new abstractions.
    - Identify required ADR, convention, barrel, LikeC4, migration, and test updates.
    - Record rejected alternatives and why they were rejected.

  tasks:
    - Keep tasks small, concrete, ordered, and independently verifiable.
    - Update contracts and tests with the behavior they validate.
    - Include required ADR, CONVENTIONS, barrel, and LikeC4 updates as explicit tasks.
    - Include focused validation after meaningful implementation groups.
    - Include npm run verify and openspec validate --all as final mandatory validation.
    - Do not mark a task complete until implementation and validation are complete.
    - Synchronize and archive only after implementation matches the specs.
